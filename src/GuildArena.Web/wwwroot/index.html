<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuildArena</title>
    <base href="/" />
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/startup.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="GuildArena.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="startup-screen" role="status" aria-live="polite">
            <p class="startup-name">GuildArena</p>
            <h1>Opening the game</h1>
            <p>Loading the application. Please wait a moment.</p>
            <div class="startup-progress" aria-hidden="true"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong. <a href="." class="reload">Reload the page</a> to try again.
        <button type="button" class="dismiss" aria-label="Dismiss error message">×</button>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.scrollToBottom = (elementId) => {
            var element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        }
    </script>
</body>

</html>
